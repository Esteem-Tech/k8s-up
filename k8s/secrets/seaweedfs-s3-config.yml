# S3 identities for SeaweedFS. Rendered with envsubst in the deploy
# workflows and mounted by the chart via allInOne.s3.existingConfigSecret.
#
# Two identities, least privilege:
#   admin - full control; used by operators (rclone migration, bucket admin)
#   epr   - the EPR app; can only read/write/list its own bucket
#
# Action syntax is "<Action>" for all buckets or "<Action>:<bucket>" for one.
# Available actions: Admin, Read, Write, List, Tagging, ReadAcp, WriteAcp.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: seaweedfs
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            { "accessKey": "${SEAWEEDFS_ADMIN_ACCESS_KEY}", "secretKey": "${SEAWEEDFS_ADMIN_SECRET_KEY}" }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "epr",
          "credentials": [
            { "accessKey": "${SEAWEEDFS_EPR_ACCESS_KEY}", "secretKey": "${SEAWEEDFS_EPR_SECRET_KEY}" }
          ],
          "actions": [
            "Read:epr-documents",
            "Write:epr-documents",
            "List:epr-documents",
            "Tagging:epr-documents"
          ]
        }
      ]
    }
