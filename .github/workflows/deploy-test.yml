name: Deploy Kubernetes Cluster Components

on:
  release:
    types: [prereleased]


jobs:
  deploy-core-components:
    runs-on: ubuntu-latest
    environment: test

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v5.0.0
      
      # Setup kubectl
      - name: install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # Setup Helm
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: 'v3.19.0'

      # Configure kubeconfig from secret
      - name: Set up kubeconfig for k3s
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.CLUSTER_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      # Add Helm repos
      - name: Add Helm repos
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update 
      
      # Replace Variables in values files
      - name: Inject secrets into Helm values
        env:
          ISSUER_NOTIFICATION_EMAIL: ${{ secrets.ISSUER_NOTIFICATION_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STORAGE_CLASS_NAME: longhorn
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_SUB_DOMAIN: minio
          MINIO_CONSOLE_SUB_DOMAIN: minio-console
          SEAWEEDFS_ADMIN_ACCESS_KEY: ${{ secrets.SEAWEEDFS_ADMIN_ACCESS_KEY }}
          SEAWEEDFS_ADMIN_SECRET_KEY: ${{ secrets.SEAWEEDFS_ADMIN_SECRET_KEY }}
          SEAWEEDFS_EPR_ACCESS_KEY: ${{ secrets.SEAWEEDFS_EPR_ACCESS_KEY }}
          SEAWEEDFS_EPR_SECRET_KEY: ${{ secrets.SEAWEEDFS_EPR_SECRET_KEY }}
          SEAWEEDFS_ADMIN_UI_PASSWORD: ${{ secrets.SEAWEEDFS_ADMIN_UI_PASSWORD }}
          SEAWEEDFS_S3_SUB_DOMAIN: s3
          SEAWEEDFS_ADMIN_SUB_DOMAIN: s3-admin
        run: |
          # Install envsubst if missing
          sudo apt-get update && sudo apt-get install -y gettext-base
          # Create temporary files with substituted values
          envsubst < ./k8s/set-up/letsencrypt-issuer.yml > ./tmp-letsencrypt.yml
          envsubst < ./k8s/secrets/cloudflare-api-token.yml > ./tmp-cloudflare-token.yml
          envsubst < ./k8s/minio/minio-values.yml > ./tmp-minio-values.yml
          envsubst < ./k8s/seaweedfs/values.yml > ./tmp-seaweedfs-values.yml
          envsubst < ./k8s/secrets/seaweedfs-s3-config.yml > ./tmp-seaweedfs-s3-config.yml
      
      # Apply Cloudflare API token secret
      - name: Apply Cloudflare API Token Secret
        run: |
          kubectl apply -f ./tmp-cloudflare-token.yml
      
      - name: Deploy Cert-Manager
        run: |
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true


      # Apply Cluster Issuer for cert-manager
      - name: Apply Let's Encrypt Cluster Issuer
        run: |
          kubectl apply -f ./tmp-letsencrypt.yml

      # Add Longhorn Helm repo
      - name: Add Longhorn Helm repo
        run: |
          helm repo add longhorn https://charts.longhorn.io
          helm repo update
      
      # Deploy Longhorn Storage Class.
      #
      # The LONGHORN_BACKUP_* secrets are optional until an off-cluster S3
      # bucket exists (post-incident-hardening.md, P0 item 1). Once set they
      # make Longhorn's "default" BackupTarget declarative and install the
      # daily RecurringJob. Longhorn >= 1.9 has no `backup-target` Setting to
      # patch any more; the chart's defaultBackupStore values populate the
      # BackupTarget CR instead. Leave them unset and this step is a no-op
      # beyond the plain chart install.
      - name: Deploy Longhorn Storage Class
        env:
          LONGHORN_BACKUP_TARGET: ${{ secrets.LONGHORN_BACKUP_TARGET }}
          LONGHORN_BACKUP_ACCESS_KEY: ${{ secrets.LONGHORN_BACKUP_ACCESS_KEY }}
          LONGHORN_BACKUP_SECRET_KEY: ${{ secrets.LONGHORN_BACKUP_SECRET_KEY }}
          LONGHORN_BACKUP_ENDPOINT: ${{ secrets.LONGHORN_BACKUP_ENDPOINT }}
        run: |
          BACKUP_ARGS=""
          if [ -n "$LONGHORN_BACKUP_TARGET" ]; then
            kubectl create namespace longhorn-system --dry-run=client -o yaml | kubectl apply -f -
            ENDPOINT_ARG=""
            [ -n "$LONGHORN_BACKUP_ENDPOINT" ] && ENDPOINT_ARG="--from-literal=AWS_ENDPOINTS=$LONGHORN_BACKUP_ENDPOINT"
            kubectl -n longhorn-system create secret generic longhorn-backup-secret \
              --from-literal=AWS_ACCESS_KEY_ID="$LONGHORN_BACKUP_ACCESS_KEY" \
              --from-literal=AWS_SECRET_ACCESS_KEY="$LONGHORN_BACKUP_SECRET_KEY" \
              $ENDPOINT_ARG \
              --dry-run=client -o yaml | kubectl apply -f -
            BACKUP_ARGS="--set defaultBackupStore.backupTarget=$LONGHORN_BACKUP_TARGET --set defaultBackupStore.backupTargetCredentialSecret=longhorn-backup-secret"
          fi

          helm upgrade --install longhorn longhorn/longhorn \
            --namespace longhorn-system \
            --create-namespace \
            --version 1.10.1 \
            -f ./k8s/longhorn/values.yml \
            $BACKUP_ARGS

          if [ -n "$LONGHORN_BACKUP_TARGET" ]; then
            kubectl apply -f ./k8s/longhorn/recurring-backup.yml
          fi
      
      # Add MinIO Helm repo
      - name: Add MinIO Helm repo
        run: |
          helm repo add minio https://charts.min.io
          helm repo update

      # Check Minio namespace existence or create it
      - name: Ensure MinIO namespace exists
        run: |
          kubectl get namespace minio || kubectl create namespace minio
      
      
      # Deploy MinIO via Helm
      - name: Deploy MinIO via Helm
        run: |
          helm upgrade --install minio minio/minio \
            -f ./tmp-minio-values.yml \
            --namespace minio

      # SeaweedFS replaces MinIO, whose community edition is archived (see
      # docs/runbooks/minio-to-seaweedfs.md). Both run side by side until the
      # EPR app is cut over; the MinIO steps above are removed after that.
      - name: Add SeaweedFS Helm repo
        run: |
          helm repo add seaweedfs https://seaweedfs.github.io/seaweedfs/helm
          helm repo update

      - name: Ensure SeaweedFS namespace exists
        run: |
          kubectl get namespace seaweedfs || kubectl create namespace seaweedfs

      # The S3 gateway reads its identities file once at start-up, so a
      # changed secret (key rotation) only takes effect after a restart.
      - name: Apply SeaweedFS S3 identities secret
        run: |
          result=$(kubectl apply -f ./tmp-seaweedfs-s3-config.yml)
          echo "$result"
          case "$result" in
            *configured*) kubectl -n seaweedfs rollout restart deployment/seaweedfs-all-in-one 2>/dev/null || true ;;
          esac

      - name: Deploy SeaweedFS via Helm
        run: |
          helm upgrade --install seaweedfs seaweedfs/seaweedfs \
            --version 4.47.0 \
            -f ./tmp-seaweedfs-values.yml \
            --namespace seaweedfs

      # Deploy Volume Snapshot CRDs and Controller
      - name: Deploy Volume Snapshot CRDs and Controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/client/config/crd/groupsnapshot.storage.k8s.io_volumegroupsnapshotclasses.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/client/config/crd/groupsnapshot.storage.k8s.io_volumegroupsnapshotcontents.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/client/config/crd/groupsnapshot.storage.k8s.io_volumegroupsnapshots.yaml

          kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
  
  deploy-monitoring:
    runs-on: ubuntu-latest
    environment: test
    needs: deploy-core-components

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v5.0.0
      
      # Setup kubectl
      - name: install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # Setup Helm
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: 'v3.19.0'

      # Configure kubeconfig from secret
      - name: Set up kubeconfig for k3s
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.CLUSTER_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config


      # Add Helm repos
      - name: Add Helm repos
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
      
      # Replace Variables in values files
      - name: Inject secrets into Helm values
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ISSUER_NOTIFICATION_EMAIL: ${{ secrets.ISSUER_NOTIFICATION_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STORAGE_CLASS_NAME: longhorn
          SUB_DOMAIN: monitoring
        run: |
          # Install envsubst if missing
          sudo apt-get update && sudo apt-get install -y gettext-base

          # Create temporary files with substituted values
          envsubst < ./k8s/monitoring/helm/grafana-values.yml > ./tmp-grafana-values.yml
          envsubst < ./k8s/monitoring/helm/prometheus-kube-stack-values.yml > ./tmp-prometheus-values.yml
          envsubst < ./k8s/monitoring/helm/loki-values.yml > ./tmp-loki-values.yml
      
      # Deploy Grafana
      - name: Deploy Grafana
        run: |
          helm upgrade --install grafana \
            grafana/grafana \
            -f ./tmp-grafana-values.yml \
            -n monitoring \
            --create-namespace
          
      # Deploy Prometheus + kube-prometheus-stack
      - name: Deploy Prometheus Stack
        run: |
          helm upgrade --install prometheus-stack \
            prometheus-community/kube-prometheus-stack \
            -f ./tmp-prometheus-values.yml \
            -n monitoring \
            --create-namespace

      # Deploy Loki + Promtail
      - name: Deploy Loki Stack
        run: |
          helm upgrade --install loki-stack \
            grafana/loki-stack \
            -f ./tmp-loki-values.yml \
            -n monitoring

  deploy-vault:
    runs-on: ubuntu-latest
    environment: test
    needs: deploy-monitoring

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v5.0.0
      
      # Setup kubectl
      - name: install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # Configure kubeconfig from secret
      - name: Set up kubeconfig for k3s
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.CLUSTER_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      # Add Helm repos
      - name: Add Helm repos
        run: |
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo update
      
      # Replace Variables in values files
      - name: Inject secrets into Vault ingress
        env:
          SUB_DOMAIN: vault
          STORAGE_CLASS_NAME: longhorn
        run: |
          # Install envsubst if missing
          sudo apt-get update && sudo apt-get install -y gettext-base

          # Create temporary files with substituted values
          envsubst < ./k8s/vault/vault-ingress.yml > ./tmp-vault-ingress.yml
          envsubst < ./k8s/vault/vault-values.yml > ./tmp-vault-values.yml
    
      
      # Deploy Vault via Helm
      - name: Deploy HashiCorp Vault via Helm
        run: |
          helm upgrade --install vault hashicorp/vault \
            -f ./tmp-vault-values.yml \
            --namespace vault \
            --create-namespace

      # Apply Vault configurations

      - name: Deploy HashiCorp Vault configurations
        run: |
          kubectl apply -f ./tmp-vault-ingress.yml -n vault

  deploy-databases:
    runs-on: ubuntu-latest
    environment: test
    needs: deploy-vault

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v5.0.0
      
      # Setup kubectl
      - name: install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # Configure kubeconfig from secret
      - name: Set up kubeconfig for k3s
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.CLUSTER_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      # Add Helm repos
      - name: Add Helm repos
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo update
      
      # Deploy CloudNative Postgres Operator
      - name: Deploy CloudNative Postgres Operator
        run: |
          helm upgrade --install cloudnative-pg cnpg/cloudnative-pg \
            --namespace database \
            --create-namespace
      
      # Deploy Postgres Database Clusters
      - name: Deploy Postgres Clusters
        run: |
          kubectl apply -f ./k8s/databases/postgres/ubutumwa-bugufi/cluster.yml -n database
          kubectl apply -f ./k8s/databases/postgres/q-flow/cluster.yml -n database
      
      # Deploy VolumeSnapshotClass for Longhorn
      - name: Deploy VolumeSnapshotClass
        run: |
          kubectl apply -f ./k8s/databases/postgres/q-flow/volumeSnapshotClass.yml -n database

      # Deploy Postgres Backups
      - name: Deploy Postgres Backups
        run: |
          kubectl apply -f ./k8s/databases/postgres/ubutumwa-bugufi/backups.yml -n database
          kubectl apply -f ./k8s/databases/postgres/q-flow/backups.yml -n database
      
      # Deploy Postgres Databases
      - name: Deploy Postgres Databases
        run: |
          kubectl apply -f ./k8s/databases/postgres/ubutumwa-bugufi/databases.yml -n database
          kubectl apply -f ./k8s/databases/postgres/q-flow/databases.yml -n database
